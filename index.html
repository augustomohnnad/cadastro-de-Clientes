<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lista de tarefas</title>
</head>
<body>
    <main class="content-main">
        <header class="content-header">
            <div>
                <h1>Cadastros de tarefas</h1>
                <small content-caption>Cadastre aqui seus clientes.</small>
            </div>
            <button id="btn-get" onclick="getCustommers()">Buscar Cadastros</button>
        </header>

        <section class="container">
            <div class="content-input">
                <label for="name">Nome: </label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="content-input">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <button id="adicionar" aria-label="Adicionar tarefa">Cadastrar</button>
            
        </section>

        <section class="container-cards"></section>
    </main>
    <script src="/script.js"></script>
</body>
</html>
